<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zhee Media Hub - Private Storage Gateway</title>
  <meta name="robots" content="noindex, nofollow">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #0a0d14;
      --bg-card: rgba(17, 24, 39, 0.85);
      --bg-card-hover: rgba(30, 41, 59, 0.95);
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.35);
      --accent-emerald: #10b981;
      --border-color: rgba(255, 255, 255, 0.08);
      --text-main: #f9fafb;
      --text-muted: #94a3b8;
      --radius: 14px;
      --radius-sm: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body {
      background: radial-gradient(circle at 50% 0%, #161f38 0%, var(--bg-main) 65%);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 80px;
    }

    .container { max-width: 1000px; margin: 0 auto; padding: 0 20px; }

    .icon {
      width: 18px;
      height: 18px;
      stroke-width: 1.8;
      stroke: currentColor;
      fill: none;
      flex-shrink: 0;
    }
    .icon-lg { width: 44px; height: 44px; stroke-width: 1.5; }

    header { padding: 40px 0 24px; text-align: center; }
    .badge {
      display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px;
      background: rgba(99, 102, 241, 0.12); border: 1px solid var(--accent-glow);
      color: #a5b4fc; border-radius: 999px; font-size: 13px; font-weight: 700;
      margin-bottom: 14px;
    }
    h1 {
      font-size: 28px; font-weight: 800;
      background: linear-gradient(135deg, #ffffff 40%, #a5b4fc 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px;
    }
    p.subtitle { color: var(--text-muted); font-size: 14px; }

    .private-lock-view {
      background: var(--bg-card); border: 1px dashed rgba(99, 102, 241, 0.3);
      border-radius: var(--radius); padding: 44px 20px; text-align: center; margin-top: 20px;
    }
    .lock-icon-wrap {
      width: 64px; height: 64px; border-radius: 50%;
      background: rgba(99, 102, 241, 0.1); border: 1px solid var(--accent-glow);
      display: inline-flex; align-items: center; justify-content: center;
      margin-bottom: 16px; color: #a5b4fc;
    }
    .private-lock-view h3 { font-size: 20px; color: #fff; margin-bottom: 8px; }
    .private-lock-view p { color: var(--text-muted); font-size: 14px; max-width: 460px; margin: 0 auto 20px; }
    
    .key-form { display: flex; max-width: 440px; margin: 0 auto; gap: 10px; }
    input[type="password"] {
      flex: 1; padding: 11px 16px; background: #080b11;
      border: 1px solid rgba(255, 255, 255, 0.15); border-radius: var(--radius-sm);
      color: #fff; font-size: 14px; outline: none;
    }
    input[type="password"]:focus { border-color: var(--accent); }

    .grid-container {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; margin-top: 16px;
    }
    .api-card {
      background: var(--bg-card); border: 1px solid var(--border-color);
      border-radius: var(--radius); padding: 20px; display: flex;
      flex-direction: column; justify-content: space-between; transition: all 0.2s ease;
    }
    .api-card:hover {
      background: var(--bg-card-hover); border-color: rgba(99, 102, 241, 0.35); transform: translateY(-2px);
    }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
    .card-title { font-size: 15px; font-weight: 700; color: #fff; }
    .tag {
      font-size: 11px; padding: 3px 8px; border-radius: 4px; font-weight: 700;
      text-transform: uppercase; background: rgba(99, 102, 241, 0.15); color: #a5b4fc;
    }
    .card-desc { font-size: 13px; color: var(--text-muted); margin-bottom: 14px; line-height: 1.5; }

    .card-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .btn {
      padding: 9px 14px; border-radius: var(--radius-sm); border: none; font-weight: 600;
      font-size: 13px; cursor: pointer; transition: all 0.2s; display: inline-flex;
      align-items: center; justify-content: center; gap: 6px; text-decoration: none;
    }
    .btn-primary { background: linear-gradient(135deg, var(--accent), #4f46e5); color: #fff; }
    .btn-outline { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-color); color: #e2e8f0; }

    .modal {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px);
      z-index: 1000; align-items: center; justify-content: center; padding: 20px;
    }
    .modal.show { display: flex; }
    .modal-content {
      background: #111726; border: 1px solid var(--border-color);
      border-radius: var(--radius); width: 100%; max-width: 780px; overflow: hidden;
    }
    .modal-header {
      padding: 16px 20px; border-bottom: 1px solid var(--border-color);
      display: flex; justify-content: space-between; align-items: center;
    }
    .modal-title { font-size: 16px; font-weight: 700; }
    .close-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; }
    .modal-body {
      padding: 20px; text-align: center; background: #000;
      min-height: 360px; display: flex; align-items: center; justify-content: center;
    }
    .media-player { max-width: 100%; max-height: 520px; border-radius: var(--radius-sm); }
    .modal-meta {
      padding: 14px 20px; background: #0b0f19; border-top: 1px solid var(--border-color);
      display: flex; justify-content: space-between; align-items: center;
      font-size: 13px; color: var(--text-muted);
    }

    .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
    .toast {
      background: #1e293b; border: 1px solid var(--border-color); color: #fff;
      padding: 12px 18px; border-radius: var(--radius-sm); font-size: 13px;
      display: flex; align-items: center; gap: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .toast.success { border-left: 4px solid var(--accent-emerald); }
    .toast.error { border-left: 4px solid #ef4444; }

    @media (max-width: 600px) {
      .key-form { flex-direction: column; }
      .grid-container { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="badge">ZHEE MEDIA GATEWAY</div>
      <h1>Khu Vực Lưu Trữ Riêng Tư (VIP Portal)</h1>
      <p class="subtitle">Hệ thống phân phối và trích xuất luồng Media được bảo vệ</p>
    </header>

    <!-- Khung Khóa Nhập Key -->
    <div id="videoLockBox" class="private-lock-view">
      <div class="lock-icon-wrap">
        <svg class="icon icon-lg" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"/></svg>
      </div>
      <h3>Yêu Cầu Khóa Xác Thực</h3>
      <p>Nhập API Key hợp lệ để truy cập hệ thống máy chủ lưu trữ media.</p>
      <div class="key-form">
        <input type="password" id="inputApiKey" placeholder="Nhập API Key (VD: zhee_vip)...">
        <button class="btn btn-primary" id="btnUnlockVideo">Mở Khóa</button>
      </div>
    </div>

    <!-- Khung Danh Sách Server Sau Khi Mở Khóa -->
    <div id="videoContentBox" style="display: none;">
      <div style="margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; background: rgba(16,185,129,0.1); padding: 12px 18px; border-radius: var(--radius-sm); border: 1px solid rgba(16,185,129,0.2);">
        <span style="color: #34d399; font-size: 14px; font-weight: 600;">Đã xác thực phiên truy cập thành công!</span>
        <button class="btn btn-outline" style="padding: 4px 10px; font-size: 12px;" id="btnLockVideo">Khóa Lại</button>
      </div>
      <div class="grid-container" id="gridVideoServers"></div>
    </div>
  </div>

  <!-- Modal Player -->
  <div class="modal" id="playerModal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title" id="modalTitle">Media Stream Viewer</div>
        <button class="close-btn" id="closeModal">
          <svg class="icon" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-meta">
        <span id="modalDesc">ID: #--</span>
        <div style="display: flex; gap: 8px;">
          <button class="btn btn-outline" id="btnNextRandom">Ngẫu Nhiên Tiếp</button>
          <a href="#" target="_blank" class="btn btn-primary" id="btnDirectLink">Xem Link Gốc</a>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script>
    let currentSessionKey = "";
    let currentActiveType = "";

    function showToast(message, type = "success") {
      const container = document.getElementById("toastContainer");
      const toast = document.createElement("div");
      toast.className = `toast ${type}`;
      toast.innerHTML = `<span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => { toast.remove(); }, 3000);
    }

    const SAFE_NODE_LIST = [
      { key: "vdgai", title: "Media Node Alpha (Portrait)", desc: "High-speed portrait stream relay." },
      { key: "cosplay", title: "Media Node Beta (Costume)", desc: "Direct dynamic visual asset stream." },
      { key: "anime", title: "Media Node Gamma (Animated)", desc: "Animated asset direct load balancer." },
      { key: "sexy", title: "Media Node Delta (Specialized)", desc: "VIP dedicated edge storage node." },
      { key: "hentai2d", title: "Media Node Epsilon 2D", desc: "Dynamic stream buffer cluster 01." },
      { key: "hentai3d", title: "Media Node Zeta 3D", desc: "Dynamic stream buffer cluster 02." }
    ];

    async function unlockVideoFolder(key) {
      try {
        const res = await fetch(`/video?key=${encodeURIComponent(key)}`);
        const data = await res.json();

        if (!res.ok || data.trang_thai === "that_bai") {
          throw new Error(data.thong_bao || "Key xác thực không hợp lệ!");
        }

        currentSessionKey = key;
        const grid = document.getElementById("gridVideoServers");
        grid.innerHTML = SAFE_NODE_LIST.map(node => `
          <div class="api-card">
            <div>
              <div class="card-top">
                <div class="card-title">${node.title}</div>
                <span class="tag">Active</span>
              </div>
              <div class="card-desc">${node.desc}</div>
            </div>
            <div class="card-actions">
              <button class="btn btn-primary" onclick="playMedia('${node.key}', '${node.title}')">Random Stream</button>
              <button class="btn btn-outline" onclick="playWithId('${node.key}', '${node.title}')">Theo ID</button>
            </div>
          </div>
        `).join("");

        document.getElementById("videoLockBox").style.display = "none";
        document.getElementById("videoContentBox").style.display = "block";
        showToast("Mở khóa thành công!");
      } catch (err) {
        showToast(err.message, "error");
      }
    }

    async function playMedia(type, title, reqId = null) {
      currentActiveType = type;
      let url = `/video?type=${encodeURIComponent(type)}&key=${encodeURIComponent(currentSessionKey)}`;
      if (reqId) url += `&id=${encodeURIComponent(reqId)}`;

      try {
        const res = await fetch(url);
        const data = await res.json();
        if (!res.ok) throw new Error(data.thong_bao || "Lỗi truy xuất media");

        const mediaUrl = data.link_video || data.link_media || "";
        const isGif = mediaUrl.endsWith(".gif");

        document.getElementById("modalTitle").textContent = title;
        document.getElementById("modalDesc").textContent = `ID: #${data.id || 'Random'}`;
        document.getElementById("btnDirectLink").href = `/video?type=${type}&raw=true&key=${encodeURIComponent(currentSessionKey)}${reqId ? `&id=${reqId}` : ''}`;

        const body = document.getElementById("modalBody");
        if (isGif) {
          body.innerHTML = `<img src="${mediaUrl}" class="media-player" alt="Media Stream">`;
        } else {
          body.innerHTML = `<video controls autoplay class="media-player" playsinline><source src="${mediaUrl}" type="video/mp4"></video>`;
        }
        document.getElementById("playerModal").classList.add("show");
      } catch (err) {
        showToast(err.message, "error");
      }
    }

    function playWithId(type, title) {
      const id = prompt(`Nhập số ID bạn muốn xem từ ${title}:`, "1");
      if (id) playMedia(type, title, id.trim());
    }

    document.getElementById("btnUnlockVideo").addEventListener("click", () => {
      const key = document.getElementById("inputApiKey").value.trim();
      if (!key) return showToast("Vui lòng nhập API Key!", "error");
      unlockVideoFolder(key);
    });

    document.getElementById("inputApiKey").addEventListener("keypress", (e) => {
      if (e.key === "Enter") document.getElementById("btnUnlockVideo").click();
    });

    document.getElementById("btnLockVideo").addEventListener("click", () => {
      currentSessionKey = "";
      document.getElementById("videoLockBox").style.display = "block";
      document.getElementById("videoContentBox").style.display = "none";
      document.getElementById("inputApiKey").value = "";
      showToast("Đã khóa lại phiên truy cập.");
    });

    document.getElementById("closeModal").addEventListener("click", () => {
      document.getElementById("playerModal").classList.remove("show");
      document.getElementById("modalBody").innerHTML = "";
    });

    document.getElementById("btnNextRandom").addEventListener("click", () => {
      if (currentActiveType) playMedia(currentActiveType, "Đang tải...");
    });
  </script>
</body>
</html>
