      github: { ten: "GitHub", mo_ta: "Profile và danh sách repo.", method: "GET", path: "/mxh/github", vi_du: "/mxh/github?=hoducminh123", mau: { trang_thai: "thanh_cong" } },
      tiktok: { ten: "TikTok", mo_ta: "Profile hoặc tải video không watermark.", method: "GET", path: "/mxh/tiktok", vi_du: "/mxh/tiktok?=tiktok", mau: { trang_thai: "thanh_cong" } },

    const navEl = document.getElementById("nav");
    const panel = document.getElementById("panel");
    const crumb = document.getElementById("crumb");
    const toast = document.getElementById("toast");
    let toastTimer;

    function notify(msg) {
      toast.textContent = msg;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 2200);
    }

    function copyText(text) {
      navigator.clipboard.writeText(text).then(() => notify("Đã sao chép.")).catch(() => notify("Không sao chép được."));
    }

    function currentId() {
      const h = (location.hash || "#home").replace(/^#\/?/, "");
      return TOOLS[h] ? h : "home";
    }

    function renderNav(filter) {
      const q = (filter || "").toLowerCase().trim();
      navEl.innerHTML = GROUPS.map((g) => {
        const items = g.items.filter((id) => {
          const t = TOOLS[id];
          if (!t) return false;
          if (!q) return true;
          return (t.ten + t.mo_ta + t.path).toLowerCase().includes(q);
        });
        if (!items.length) return "";
        return `<div class="nav-label">${g.label}</div>` + items.map((id) =>
          `<a href="#${id}" data-id="${id}">${TOOLS[id].ten}</a>`
        ).join("");
      }).join("");
    }

    function renderHome() {
      const tiles = Object.keys(TOOLS).filter((id) => id !== "home").slice(0, 12).map((id) => {
        const t = TOOLS[id];
        return `<a class="home-tile" href="#${id}"><strong>${t.ten}</strong><span>${t.mo_ta}</span></a>`;
      }).join("");
      panel.innerHTML = `
        <h2>Public API</h2>
        <p class="lead">Cổng tra cứu cho đối tác. Chọn tool ở cột trái. Endpoint video không công khai.</p>
        <div class="cards">
          <div class="card">
            <h3>Tác giả</h3>
            <p><strong>Hồ Đức Minh (Zhee Dev)</strong></p>
            <p class="muted">Full-Stack Developer & API Specialist</p>
            <div class="row-btns">
              <a class="btn" href="https://t.me/zheedev" target="_blank" rel="noopener">Telegram</a>
              <a class="btn" href="/list" rel="nofollow">JSON /list</a>
            </div>
          </div>
          <div class="card">
            <h3>JSON gốc</h3>
            <div class="label">Endpoint</div>
            <div class="endpoint">GET ${ORIGIN}/?format=json</div>
            <div class="row-btns">
              <a class="btn btn-dark" href="/?format=json">Mở JSON</a>
              <button type="button" data-copy="${ORIGIN}/?format=json">Sao chép</button>
            </div>
          </div>
        </div>
        <div class="home-grid">${tiles}</div>`;
    }

    function renderTool(id) {
      const t = TOOLS[id];
      const full = ORIGIN + t.vi_du;
      const pathFull = ORIGIN + t.path;
      panel.innerHTML = `
        <h2>${t.ten}</h2>
        <p class="lead">${t.mo_ta}</p>
        <div class="cards">
          <div class="card">
            <h3>Endpoint</h3>
            <div class="label">${t.method}</div>
            <div class="endpoint">${pathFull}${t.vi_du.includes("?") ? t.vi_du.slice(t.vi_du.indexOf("?")) : ""}</div>
            <p class="muted">Ví dụ: ${full}</p>
            <div class="row-btns">
              <a class="btn btn-dark" href="${t.vi_du}" target="_blank" rel="nofollow">Gọi thử</a>
              <button type="button" data-copy="${full}">Sao chép</button>
            </div>
          </div>
          <div class="card">
            <h3>Đường dẫn</h3>
            <div class="label">Path</div>
            <div class="endpoint">${t.path}</div>
            <p class="muted">Alias cùng chức năng có thể có dưới /api/…</p>
          </div>
        </div>
        <div class="sample">
          <div class="sample-head">
            <span>Phản hồi mẫu</span>
            <button type="button" data-copy='${JSON.stringify(t.mau)}'>Sao chép JSON</button>
          </div>
          <pre>${JSON.stringify(t.mau, null, 2).replace(/</g, "&lt;")}</pre>
        </div>`;
    }

    function paint() {
      const id = currentId();
      document.querySelectorAll(".nav a").forEach((a) => a.classList.toggle("active", a.dataset.id === id));
      crumb.textContent = id === "home" ? "Public API" : TOOLS[id].ten;
      document.title = (id === "home" ? "Zhee API — Tài liệu công khai" : TOOLS[id].ten + " | Zhee API");
      if (id === "home") renderHome();
      else renderTool(id);
    }

    document.getElementById("q").addEventListener("input", (e) => {
      renderNav(e.target.value);
      document.querySelectorAll(".nav a").forEach((a) => a.classList.toggle("active", a.dataset.id === currentId()));
    });
    document.body.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-copy]");
      if (btn) copyText(btn.getAttribute("data-copy"));
    });
    window.addEventListener("hashchange", paint);
    renderNav("");
    paint();

    fetch("/?format=json").then((r) => r.json()).then((d) => {
      const t = d.thoi_gian_hoat_dong;
      if (t && t.da_hoat_dong) document.getElementById("uptime").textContent = "Hoạt động: " + t.da_hoat_dong + " · từ " + t.moc_khai_truong;
    }).catch(() => {});
  </script>
</body>
</html>
