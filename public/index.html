<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zhee API — Tài liệu công khai | Hồ Đức Minh</title>
  <meta name="description" content="Tài liệu REST API công khai Zhee Dev: mail, tools, mạng xã hội, ngân hàng, web. Hồ Đức Minh (Zhee Dev).">
  <meta name="keywords" content="Zhee API, REST API, checkscam, taomail, VietQR, Hồ Đức Minh">
  <meta name="author" content="Hồ Đức Minh (Zhee Dev)">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://api-zhee.vercel.app/">
  <meta property="og:title" content="Zhee API — Tài liệu công khai">
  <meta property="og:description" content="Cổng tra cứu REST API đa chuyên mục của Hồ Đức Minh (Zhee Dev).">

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script type="application/ld+json">

  </script>
  <style>
    :root {
      --bg: #f4f5f8;
      --sidebar: #ffffff;
      --card: #ffffff;
      --line: #eceef3;
      --text: #111827;
      --muted: #6b7280;
      --pink: #e11d48;
      --radius: 16px;
      --code-bg: #0f172a;
      --code-fg: #e5e7eb;
      --nav-active: #111827;
      --nav-active-fg: #fff;
      --shadow: 0 1px 2px rgba(16,24,40,.05);
    }
    html[data-theme="dark"] {
      --bg: #0b0f17;
      --sidebar: #111827;
      --card: #151c28;
      --line: #243044;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --pink: #fb7185;
      --code-bg: #020617;
      --code-fg: #e5e7eb;
      --nav-active: #f8fafc;
      --nav-active-fg: #111827;
      --shadow: none;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      min-height: 100vh;
    }
    html { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--muted) 35%, transparent) transparent; }
    * { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--muted) 35%, transparent) transparent; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: color-mix(in srgb, var(--muted) 35%, transparent);
      border-radius: 99px;
    }
    ::-webkit-scrollbar-thumb:hover { background: color-mix(in srgb, var(--muted) 55%, transparent); }

    .ico, [data-lucide] {
      width: 18px; height: 18px; flex-shrink: 0; display: block;
      stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round;
    }
    .ico-brand { width: 18px; height: 18px; display: block; flex-shrink: 0; }
    .ico-btn { width: 18px; height: 18px; }
    .ico-head { width: 20px; height: 20px; }
    .ico-card { width: 18px; height: 18px; }
    .ico-sm { width: 16px; height: 16px; }
    .drop > summary .ico, .drop > summary [data-lucide] { width: 18px; height: 18px; }
    .drop a .ico, .drop a [data-lucide] { width: 18px; height: 18px; }
    .act .ico, .act [data-lucide], .act .ico-brand { width: 16px; height: 16px; }
    article h2 .ico, article h2 [data-lucide], .home-tile .ico, .home-tile [data-lucide] { width: 20px; height: 20px; }
    .crumb .ico, .crumb [data-lucide], .uptime .ico, .uptime [data-lucide] { width: 16px; height: 16px; }
    .icon-btn [data-lucide] { width: 18px; height: 18px; }

    .sidebar {
      width: 280px; background: var(--sidebar); border-right: 1px solid var(--line);
      display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow: hidden;
    }
    .brand { padding: 18px 18px 12px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); }
    .brand-mark {
      width: 38px; height: 38px; border-radius: 12px;
      background: linear-gradient(135deg, #111827, #b45309);
      color: #fff; font-weight: 800; display: grid; place-items: center; font-size: 14px;
    }
    .brand h1 { font-size: 15px; font-weight: 800; line-height: 1.15; }
    .brand p { font-size: 11px; color: var(--muted); }
    .side-tools { padding: 10px 12px; display: flex; gap: 8px; }
    .side-tools input {
      flex: 1; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px;
      font: inherit; font-size: 13px; outline: none; background: var(--bg); color: var(--text);
    }
    .icon-btn {
      width: 36px; height: 36px; border: 1px solid var(--line); background: var(--card); color: var(--text);
      border-radius: 10px; cursor: pointer; display: grid; place-items: center;
    }
    .nav { overflow-y: auto; flex: 1; padding: 4px 10px 24px; }
    .drop { margin: 4px 0; }
    .drop > summary {
      list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px;
      padding: 8px 10px; border-radius: 10px; font-size: 12px; font-weight: 800;
      letter-spacing: .06em; text-transform: uppercase; color: var(--muted); user-select: none;
      gap: 10px;
    }
    .drop > summary::-webkit-details-marker { display: none; }
    .drop > summary:hover { background: color-mix(in srgb, var(--text) 6%, transparent); }
    .chevron { margin-left: auto; width: 16px !important; height: 16px !important; transition: transform .22s ease; }
    .drop.is-open .chevron { transform: rotate(180deg); }
    svg.lucide { overflow: visible; flex-shrink: 0; display: block; }
    .drop-panel { overflow: hidden; height: 0; transition: height .22s ease; }
    .drop.is-open .drop-panel { height: auto; }
    .drop a {
      display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text);
      font-size: 13.5px; font-weight: 600; padding: 7px 10px 7px 14px; border-radius: 10px; margin: 1px 0;
    }
    .drop a:hover { background: color-mix(in srgb, var(--text) 6%, transparent); }
    .drop a.active { background: var(--nav-active); color: var(--nav-active-fg); }

    .main { flex: 1; min-width: 0; overflow-y: auto; overflow-x: hidden; }
    .topbar {
      padding: 16px 28px 8px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    .crumb { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
    .uptime {
      font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 8px;
      background: var(--card); border: 1px solid var(--line); padding: 6px 10px; border-radius: 999px;
    }
    .uptime strong { color: var(--text); font-weight: 700; }
    article { padding: 8px 28px 48px; max-width: 1080px; }
    article h2 { font-size: 26px; font-weight: 800; margin-bottom: 6px; display: flex; align-items: center; gap: 10px; }
    .lead { color: var(--muted); font-size: 14.5px; line-height: 1.6; margin-bottom: 22px; }
    .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 20px 22px; box-shadow: var(--shadow);
    }
    .card h3 { font-size: 16px; margin-bottom: 12px; }
    .label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; }
    .endpoint { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 13px; color: var(--pink); word-break: break-all; line-height: 1.55; }
    .muted { color: var(--muted); font-size: 13px; margin-top: 8px; }
    .row-btns { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
    button.act, a.act {
      font: inherit; font-size: 13px; font-weight: 700; border-radius: 10px; padding: 8px 12px; cursor: pointer;
      border: 1px solid var(--line); background: var(--card); color: var(--text); text-decoration: none;
      display: inline-flex; align-items: center; gap: 8px;
    }
    button.act:hover, a.act:hover { filter: brightness(1.05); }
    .act-dark { background: var(--nav-active); color: var(--nav-active-fg); border-color: var(--nav-active); }
    .sample { background: var(--code-bg); color: var(--code-fg); border-radius: var(--radius); padding: 18px 20px; overflow: auto; }
    .sample-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-weight: 700; font-family: "Plus Jakarta Sans", sans-serif; }
    .sample pre { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12.5px; line-height: 1.55; white-space: pre-wrap; }
    .home-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
    .home-tile {
      background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px;
      text-decoration: none; color: inherit; display: flex; flex-direction: column; gap: 8px; align-items: stretch;
    }
    .home-tile-top { display: flex; align-items: center; gap: 10px; }
    .home-tile-top strong { display: block; margin: 0; line-height: 1.35; }
    .home-tile span { font-size: 12.5px; color: var(--muted); line-height: 1.45; padding-left: 30px; }

    .toast, .dialog-backdrop { z-index: 40; }
    .toast {
      position: fixed; right: 18px; bottom: 18px; background: var(--nav-active); color: var(--nav-active-fg);
      padding: 11px 14px; border-radius: 10px; font-size: 13px; font-weight: 600;
      opacity: 0; transform: translateY(8px); pointer-events: none; transition: .2s;
    }
    .toast.show { opacity: 1; transform: none; }
    .dialog-backdrop {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45);
      align-items: center; justify-content: center; padding: 20px;
    }
    .dialog-backdrop.show { display: flex; }
    .dialog-box {
      background: var(--card); color: var(--text); border: 1px solid var(--line);
      border-radius: 16px; padding: 22px; max-width: 400px; width: 100%;
    }
    .dialog-box p { margin: 0 0 16px; line-height: 1.5; }

    @media (max-width: 900px) {
      body { flex-direction: column; }
      .sidebar { width: 100%; height: auto; position: relative; }
      .nav { max-height: 280px; }
      .cards { grid-template-columns: 1fr; }
      article { padding: 8px 16px 40px; }
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">Z</div>
      <div>
        <h1>Zhee API</h1>
        <p>Cổng tra cứu công khai</p>
      </div>
    </div>
    <div class="side-tools">
      <input id="q" type="search" placeholder="Tìm tool…" autocomplete="off">
      <button class="icon-btn" id="themeBtn" type="button" title="Đổi giao diện" aria-label="Đổi giao diện"></button>
    </div>
    <nav class="nav" id="nav" aria-label="Danh mục API"></nav>
  </aside>
  <div class="main">
    <div class="topbar">
      <div class="crumb" id="crumb"></div>
      <div class="uptime" id="uptime"></div>
    </div>
    <article id="panel"></article>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <div class="dialog-backdrop" id="dialog" role="dialog" aria-modal="true">
    <div class="dialog-box">
      <p id="dialogMsg"></p>
      <button class="act act-dark" type="button" id="dialogOk">OK</button>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script>
    const ORIGIN = location.origin;
    const START = new Date("2026-08-28T00:00:00+07:00");
    const GROUP_META = [
      { match: /mail/i, label: "Mail", icon: "mail" },
      { match: /tools|ai|developer/i, label: "Công cụ", icon: "wrench" },
      { match: /probability|xác suất|tài xỉu/i, label: "Tài xỉu", icon: "dices" },
      { match: /xã hội|mạng xã hội|gaming|^media$/i, label: "Mạng xã hội", icon: "share-2" },
      { match: /web/i, label: "Web", icon: "globe-2" },
      { match: /fintech|bank|thanh toán/i, label: "Ngân hàng", icon: "landmark" },
      { match: /download/i, label: "Tải media", icon: "download" }
    ];
    // Simple Icons — Telegram brand (Lucide không có brand Telegram)
    const TELEGRAM_ICON = '<svg class="ico-brand" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.458.02.639-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>';

    function ico(name, cls) {
      if (name === "telegram") return TELEGRAM_ICON;
      return `<i data-lucide="${name}" class="${cls || ""}"></i>`;
    }
    function paintIcons() {
      if (window.lucide) {
        lucide.createIcons({
          attrs: { "stroke-width": "1.9", "stroke-linecap": "round", "stroke-linejoin": "round" }
        });
      }
    }
    function esc(s) {
      return String(s || "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    }
    function slug(path) {
      return String(path || "home").replace(/^\//, "").replace(/\//g, "-") || "home";
    }
    function groupOf(chuyen) {
      const hit = GROUP_META.find((g) => g.match.test(String(chuyen || "")));
      return hit || { label: chuyen || "Khác", icon: "sparkles" };
    }
    function iconFor(path, chuyen) {
      const p = String(path || "").toLowerCase();
      if (/taomail/.test(p)) return "mail-plus";
      if (/mail\/check|hopthu|inbox/.test(p)) return "inbox";
      if (/\/mail$/.test(p)) return "mail";
      if (/checkscam/.test(p)) return "shield-alert";
      if (/checkkeyai|aikey/.test(p)) return "key-round";
      if (/captcha/.test(p)) return "scan-line";
      if (/trans/.test(p)) return "languages";
      if (/ngl/.test(p)) return "message-circle";
      if (/locket/.test(p)) return "camera";
      if (/checksdt/.test(p)) return "smartphone";
      if (/checkimei/.test(p)) return "cpu";
      if (/\/chat/.test(p)) return "bot";
      if (/\/key/.test(p)) return "key-round";
      if (/freefire/.test(p)) return "gamepad-2";
      if (/removebg/.test(p)) return "image";
      if (/enhance/.test(p)) return "sparkles";
      if (/spotify/.test(p)) return "music";
      if (/soundcloud/.test(p)) return "audio-lines";
      if (/instagram/.test(p)) return "instagram";
      if (/roblox/.test(p)) return "gamepad-2";
      if (/github/.test(p)) return "github";
      if (/tiktok/.test(p)) return "video";
      if (/youtube/.test(p)) return "youtube";
      if (/discord/.test(p)) return "messages-square";
      if (/telegram/.test(p)) return "telegram";
      if (/twitter|\/x$/.test(p)) return "twitter";
      if (/facebook/.test(p)) return "facebook";
      if (/zalo/.test(p)) return "message-circle";
      if (/shopee/.test(p)) return "shopping-bag";
      if (/endpoint/.test(p)) return "unplug";
      if (/domain/.test(p)) return "app-window";
      if (/\/web/.test(p)) return "globe-2";
      if (/bank/.test(p)) return "landmark";
      if (/download/.test(p)) return "download";
      if (/\/bai/.test(p)) return "layers";
      if (/baucua/.test(p)) return "dice-5";
      if (/bcr|baccarat/.test(p)) return "circle-dot";
      if (/taixiu|suka|b52|789|sunwin|hitclub/.test(p)) return "dices";
      if (/mxh/.test(p)) return "share-2";
      return groupOf(chuyen).icon;
    }
    function tinhUptime() {
      let ms = Date.now() - START.getTime();
      if (ms < 0) ms = 0;
      const h = Math.floor(ms / 3600000);
      const d = Math.floor(h / 24);
      const gio = h % 24;
      const phut = Math.floor((ms % 3600000) / 60000);
      return { chuoi: d + " ngày " + gio + " giờ " + phut + " phút", moc: "28/8/2026" };
    }

    const themeBtn = document.getElementById("themeBtn");
    const navEl = document.getElementById("nav");
    const panel = document.getElementById("panel");
    const crumb = document.getElementById("crumb");
    const toast = document.getElementById("toast");
    const dialog = document.getElementById("dialog");
    const dialogMsg = document.getElementById("dialogMsg");
    let toastTimer;
    let CATALOG = [];

    function applyTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      localStorage.setItem("zhee-theme", theme);
      themeBtn.innerHTML = ico(theme === "dark" ? "sun" : "moon", "ico-btn");
      paintIcons();
    }
    applyTheme(localStorage.getItem("zhee-theme") || "light");
    themeBtn.addEventListener("click", () => {
      applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
    });

    function notify(msg) {
      toast.textContent = msg;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 2200);
    }
    function appAlert(msg) {
      dialogMsg.textContent = msg;
      dialog.classList.add("show");
    }
    document.getElementById("dialogOk").addEventListener("click", () => dialog.classList.remove("show"));
    dialog.addEventListener("click", (e) => { if (e.target === dialog) dialog.classList.remove("show"); });

    function copyText(text) {
      navigator.clipboard.writeText(text).then(() => notify("Đã sao chép.")).catch(() => appAlert("Không sao chép được. Hãy copy thủ công."));
    }

    function currentId() {
      const h = (location.hash || "#home").replace(/^#\/?/, "");
      if (h === "home" || !h) return "home";
      return CATALOG.some((t) => t.id === h) ? h : "home";
    }

    function renderNav(filter) {
      const q = (filter || "").toLowerCase().trim();
      const groups = [];
      const map = new Map();
      CATALOG.forEach((t) => {
        const g = groupOf(t.chuyen_muc);
        if (q && !(t.ten + t.mo_ta + t.path).toLowerCase().includes(q)) return;
        if (!map.has(g.label)) {
          const node = { label: g.label, icon: g.icon, items: [] };
          map.set(g.label, node);
          groups.push(node);
        }
        map.get(g.label).items.push(t);
      });
      const open = new Set(JSON.parse(localStorage.getItem("zhee-open-v2") || "[]"));
      navEl.innerHTML = `
        <details class="drop is-open" open>
          <summary>${ico("home")} Chính ${ico("chevron-down", "chevron")}</summary>
          <div class="drop-panel"><div class="drop-panel-inner">
            <a href="#home" data-id="home">${ico("home")} Trang chủ</a>
          </div></div>
        </details>` + groups.map((g) => `
        <details class="drop${open.has(g.label) || q ? " is-open" : ""}" data-group="${esc(g.label)}" open>
          <summary>${ico(g.icon)} ${esc(g.label)} ${ico("chevron-down", "chevron")}</summary>
          <div class="drop-panel"><div class="drop-panel-inner">
          ${g.items.map((t) => `<a href="#${t.id}" data-id="${t.id}">${ico(iconFor(t.path, t.chuyen_muc))} ${esc(t.ten)}</a>`).join("")}
          </div></div>
        </details>`).join("");
    }

    function rememberOpen() {
      const open = [...navEl.querySelectorAll("details.drop.is-open")].map((d) => d.dataset.group).filter(Boolean);
      localStorage.setItem("zhee-open-v2", JSON.stringify(open));
    }
    navEl.addEventListener("click", (e) => {
      const sum = e.target.closest("summary");
      if (!sum || !navEl.contains(sum)) return;
      const details = sum.parentElement;
      if (!details.classList.contains("drop")) return;
      e.preventDefault();
      const panelEl = details.querySelector(".drop-panel");
      if (!panelEl) return;
      const inner = panelEl.querySelector(".drop-panel-inner");
      const opening = !details.classList.contains("is-open");
      if (opening) {
        details.classList.add("is-open");
        panelEl.style.height = "0px";
        requestAnimationFrame(() => {
          panelEl.style.height = (inner ? inner.scrollHeight : panelEl.scrollHeight) + "px";
        });
        panelEl.addEventListener("transitionend", () => { panelEl.style.height = "auto"; }, { once: true });
      } else {
        panelEl.style.height = (inner ? inner.scrollHeight : panelEl.scrollHeight) + "px";
        requestAnimationFrame(() => { panelEl.style.height = "0px"; });
        panelEl.addEventListener("transitionend", () => { details.classList.remove("is-open"); panelEl.style.height = ""; }, { once: true });
      }
      rememberOpen();
    });

    function renderHome() {
      const tiles = CATALOG.slice(0, 12).map((t) => `
        <a class="home-tile" href="#${t.id}">
          <div class="home-tile-top">${ico(iconFor(t.path, t.chuyen_muc), "ico-head")}<strong>${esc(t.ten)}</strong></div>
          <span>${esc(t.mo_ta)}</span>
        </a>`).join("");
      panel.innerHTML = `
        <h2>${ico("globe-2", "ico-head")} Public API</h2>
        <p class="lead">Cổng tra cứu cho đối tác. Chọn tool ở cột trái — danh sách lấy từ <code>/list</code>, thêm API trên server là giao diện tự cập nhật. Endpoint video không công khai.</p>
        <div class="cards">
          <div class="card">
            <h3>Tác giả</h3>
            <p><strong>Hồ Đức Minh (Zhee Dev)</strong></p>
            <p class="muted">Full-Stack Developer & API Specialist</p>
            <div class="row-btns">
              <a class="act" href="https://t.me/zheedev" target="_blank" rel="noopener">${ico("telegram")} Telegram</a>
              <a class="act" href="/list" rel="nofollow">${ico("link-2")} JSON /list</a>
            </div>
          </div>
          <div class="card">
            <h3>JSON gốc</h3>
            <div class="label">Endpoint</div>
            <div class="endpoint">GET ${ORIGIN}/?format=json</div>
            <div class="row-btns">
              <a class="act act-dark" href="/?format=json">${ico("external-link")} Mở JSON</a>
              <button class="act" type="button" data-copy="${ORIGIN}/?format=json">${ico("copy")} Sao chép</button>
            </div>
          </div>
        </div>
        <div class="home-grid">${tiles}</div>`;
    }

    function renderTool(id) {
      const t = CATALOG.find((x) => x.id === id);
      if (!t) return renderHome();
      const full = t.vi_du || (ORIGIN + t.path);
      const mau = { trang_thai: "thanh_cong", chuyen_muc: t.chuyen_muc, duong_dan: t.path, mo_ta: t.mo_ta };
      panel.innerHTML = `
        <h2>${ico(iconFor(t.path, t.chuyen_muc), "ico-head")} ${esc(t.ten)}</h2>
        <p class="lead">${esc(t.mo_ta)}</p>
        <div class="cards">
          <div class="card">
            <h3>Endpoint</h3>
            <div class="label">GET</div>
            <div class="endpoint">${esc(full)}</div>
            <p class="muted">Path: ${esc(t.path)}</p>
            <div class="row-btns">
              <a class="act act-dark" href="${esc(t.path + (t.params || ""))}" target="_blank" rel="nofollow">${ico("external-link")} Gọi thử</a>
              <button class="act" type="button" data-copy="${esc(full)}">${ico("copy")} Sao chép</button>
            </div>
          </div>
          <div class="card">
            <h3>Đường dẫn</h3>
            <div class="label">Path</div>
            <div class="endpoint">${esc(t.path)}</div>
            <p class="muted">${esc(t.chuyen_muc)}</p>
          </div>
        </div>
        <div class="sample">
          <div class="sample-head">
            <span>Phản hồi mẫu</span>
            <button class="act" type="button" data-copy='${esc(JSON.stringify(mau))}'>${ico("copy")} Sao chép JSON</button>
          </div>
          <pre>${esc(JSON.stringify(mau, null, 2))}</pre>
        </div>`;
    }

    function paint() {
      const id = currentId();
      document.querySelectorAll(".nav a").forEach((a) => a.classList.toggle("active", a.dataset.id === id));
      const t = CATALOG.find((x) => x.id === id);
      crumb.innerHTML = ico("search") + " " + (id === "home" ? "Public API" : (t ? t.ten : "Public API"));
      document.title = id === "home" ? "Zhee API — Tài liệu công khai | Hồ Đức Minh" : ((t ? t.ten : "API") + " | Zhee API");
      if (id === "home") renderHome();
      else renderTool(id);
      paintIcons();
    }

    document.getElementById("q").addEventListener("input", (e) => {
      renderNav(e.target.value);
      document.querySelectorAll(".nav a").forEach((a) => a.classList.toggle("active", a.dataset.id === currentId()));
      paintIcons();
    });
    document.body.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-copy]");
      if (btn) copyText(btn.getAttribute("data-copy"));
    });
    window.addEventListener("hashchange", paint);

    const u = tinhUptime();
    document.getElementById("uptime").innerHTML = ico("clock-3") + " Từ " + u.moc + " · <strong>" + u.chuoi + "</strong>";
    paintIcons();

    fetch("/list")
      .then((r) => r.json())
      .then((data) => {
        const ds = data.danh_sach || {};
        CATALOG = Object.values(ds)
          .filter((x) => x && x.duong_dan && !/\/video$/i.test(x.duong_dan))
          .map((x) => ({
            id: slug(x.duong_dan),
            ten: x.ten_api,
            mo_ta: x.mo_ta,
            path: x.duong_dan,
            chuyen_muc: x.chuyen_muc,
            vi_du: x.link_vi_du,
            params: (x.link_vi_du || "").split(x.duong_dan)[1] || ""
          }));
        renderNav("");
        paint();
      })
      .catch(() => {
        appAlert("Không tải được danh sách API từ /list.");
        renderNav("");
        paint();
      });
  </script>
</body>
</html>
