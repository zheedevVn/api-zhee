<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zhee Dev - Trung Tâm API Gateway & Developer Hub</title>
  <meta name="description" content="Nền tảng REST API đa năng và cổng dịch vụ của Hồ Đức Minh (Zhee Dev).">
  <meta name="keywords" content="Zhee API, Zhee Dev, REST API, API Gateway">
  <meta name="author" content="Hồ Đức Minh (Zhee Dev)">
  <meta name="robots" content="index, follow">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #0a0d14;
      --bg-card: rgba(17, 24, 39, 0.85);
      --bg-card-hover: rgba(30, 41, 59, 0.95);
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.35);
      --accent-emerald: #10b981;
      --border-color: rgba(255, 255, 255, 0.08);
      --text-main: #f9fafb;
      --text-muted: #94a3b8;
      --radius: 14px;
      --radius-sm: 8px;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #080b11; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: #334155; }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body {
      background: radial-gradient(circle at 50% 0%, #161f38 0%, var(--bg-main) 65%);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 80px;
    }

    .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

    .icon {
      width: 18px;
      height: 18px;
      stroke-width: 1.8;
      stroke: currentColor;
      fill: none;
      flex-shrink: 0;
    }

    header { padding: 40px 0 24px; text-align: center; }
    .badge {
      display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px;
      background: rgba(99, 102, 241, 0.12); border: 1px solid var(--accent-glow);
      color: #a5b4fc; border-radius: 999px; font-size: 13px; font-weight: 700;
      margin-bottom: 14px; letter-spacing: 0.5px;
    }
    h1 {
      font-size: 32px; font-weight: 800;
      background: linear-gradient(135deg, #ffffff 40%, #a5b4fc 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px;
    }
    p.subtitle { color: var(--text-muted); font-size: 15px; }

    .author-card {
      background: var(--bg-card); border: 1px solid var(--border-color);
      border-radius: var(--radius); padding: 20px; margin: 20px 0 30px;
      display: flex; justify-content: space-between; align-items: center;
      gap: 20px; flex-wrap: wrap; backdrop-filter: blur(10px);
    }
    .author-info h3 { font-size: 17px; margin-bottom: 4px; }
    .author-info p { font-size: 13px; color: var(--text-muted); }
    .social-links { display: flex; gap: 10px; flex-wrap: wrap; }

    .category-section { margin-bottom: 40px; }
    .section-title {
      font-size: 19px; font-weight: 700; margin-bottom: 16px;
      display: flex; align-items: center; gap: 10px;
    }
    .section-title::before {
      content: ''; width: 4px; height: 18px; background: var(--accent); border-radius: 2px;
    }

    .grid-container {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 16px;
    }
    .api-card {
      background: var(--bg-card); border: 1px solid var(--border-color);
      border-radius: var(--radius); padding: 20px; display: flex;
      flex-direction: column; justify-content: space-between; transition: all 0.2s ease;
    }
    .api-card:hover {
      background: var(--bg-card-hover); border-color: rgba(99, 102, 241, 0.35); transform: translateY(-2px);
    }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
    .card-title { font-size: 16px; font-weight: 700; color: #fff; }
    .tag {
      font-size: 11px; padding: 3px 8px; border-radius: 4px; font-weight: 700;
      text-transform: uppercase; background: rgba(16, 185, 129, 0.15); color: #34d399;
    }
    .card-desc { font-size: 13px; color: var(--text-muted); margin-bottom: 14px; line-height: 1.5; }

    .endpoint-block {
      background: #080b11; border: 1px solid rgba(255,255,255,0.06);
      border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 16px;
    }
    .endpoint-label { font-size: 10px; font-weight: 700; color: #64748b; text-transform: uppercase; margin-bottom: 4px; }
    .endpoint-code { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #93c5fd; word-break: break-all; }

    .card-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .btn {
      padding: 9px 14px; border-radius: var(--radius-sm); border: none; font-weight: 600;
      font-size: 13px; cursor: pointer; transition: all 0.2s; display: inline-flex;
      align-items: center; justify-content: center; gap: 6px; text-decoration: none;
    }
    .btn-primary { background: linear-gradient(135deg, var(--accent), #4f46e5); color: #fff; }
    .btn-primary:hover { opacity: 0.95; transform: translateY(-1px); }
    .btn-outline { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-color); color: #e2e8f0; }
    .btn-outline:hover { background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.2); }

    .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
    .toast {
      background: #1e293b; border: 1px solid var(--border-color); color: #fff;
      padding: 12px 18px; border-radius: var(--radius-sm); font-size: 13px;
      display: flex; align-items: center; gap: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .toast.success { border-left: 4px solid var(--accent-emerald); }

    @media (max-width: 650px) {
      .author-card { flex-direction: column; align-items: flex-start; }
      .grid-container { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="badge">
        <svg class="icon" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 13.5l10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75z"/></svg>
        ZHEE API ENGINE v7.2.0
      </div>
      <h1>Trung Tâm API Gateway & Developer Hub</h1>
      <p class="subtitle">Nền tảng REST API đa năng & Cổng Tra Cứu Dịch Vụ Trực Tuyến</p>
    </header>

    <!-- Tác Giả & Trạng Thái -->
    <div class="author-card">
      <div class="author-info">
        <h3>Hồ Đức Minh (Zhee Dev)</h3>
        <p>Full-Stack Developer & API Specialist | Trạng thái: <strong style="color: #10b981;">Online</strong></p>
      </div>
      <div class="social-links">
        <a href="https://facebook.com/hoducminh.depzai" target="_blank" class="btn btn-outline" style="padding: 6px 12px; font-size: 12px;">Facebook</a>
        <a href="https://t.me/zheevipv1" target="_blank" class="btn btn-outline" style="padding: 6px 12px; font-size: 12px;">Telegram</a>
        <a href="https://github.com/hoducminh123" target="_blank" class="btn btn-outline" style="padding: 6px 12px; font-size: 12px;">GitHub</a>
        <a href="/list" target="_blank" class="btn btn-primary" style="padding: 6px 14px; font-size: 12px;">Xem Toàn Bộ API (/list)</a>
      </div>
    </div>

    <!-- Danh Sách Chuyên Mục Công Khai -->
    <section class="category-section">
      <div class="section-title">Danh Sách Chuyên Mục API</div>
      <div class="grid-container" id="gridPublicApis"></div>
    </section>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script>
    const origin = window.location.origin;

    function showToast(message) {
      const container = document.getElementById("toastContainer");
      const toast = document.createElement("div");
      toast.className = "toast success";
      toast.innerHTML = `<svg class="icon" style="color: #34d399;" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg><span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => { toast.remove(); }, 3000);
    }

    function copyText(text) {
      navigator.clipboard.writeText(text);
      showToast("Đã sao chép endpoint link!");
    }

    const PUBLIC_CATEGORIES = [
      {
        name: "API Mạng Xã Hội & Game (/mxh)",
        desc: "Tra cứu & phân tích 10 nền tảng: Instagram, Roblox, GitHub, TikTok, YouTube, Discord, Telegram, Twitter, Facebook, Zalo.",
        url: `${origin}/mxh`
      },
      {
        name: "Công Cụ AI & Tiện Ích (/tools)",
        desc: "AI Chat Assistant (Gemini & ChatGPT), Tra cứu Free Fire, Tách nền ảnh AI, Nâng cấp ảnh HD 4K, Quản lý Key.",
        url: `${origin}/tools`
      },
      {
        name: "Bóc Tách & Tải Đa Phương Tiện (/downloads)",
        desc: "Bóc tách trọn bộ ảnh truyện tranh, bài viết và trích xuất luồng phát video trực tiếp MP4.",
        url: `${origin}/downloads`
      },
      {
        name: "Quản Trị Mạng & DNS (/web)",
        desc: "Công cụ kiểm tra DNS, Ping, Whois và phân tích trạng thái máy chủ website.",
        url: `${origin}/web`
      },
      {
        name: "Dịch Vụ Email Tạm Thời (/mail)",
        desc: "Hệ thống tạo email ảo nhận mã xác minh OTP và kiểm tra định dạng email.",
        url: `${origin}/mail`
      },
      {
        name: "Cổng Thanh Toán & Ngân Hàng (/bank)",
        desc: "Tạo mã VietQR tự động, tra cứu danh sách ngân hàng Napas 247.",
        url: `${origin}/bank`
      }
    ];

    window.addEventListener("DOMContentLoaded", () => {
      document.getElementById("gridPublicApis").innerHTML = PUBLIC_CATEGORIES.map(item => `
        <div class="api-card">
          <div>
            <div class="card-top">
              <div class="card-title">${item.name}</div>
              <span class="tag">Active</span>
            </div>
            <div class="card-desc">${item.desc}</div>
            <div class="endpoint-block">
              <div class="endpoint-label">Endpoint URL</div>
              <div class="endpoint-code">${item.url}</div>
            </div>
          </div>
          <div class="card-actions">
            <a href="${item.url}" target="_blank" class="btn btn-primary">Mở API</a>
            <button class="btn btn-outline" onclick="copyText('${item.url}')">Sao Chép</button>
          </div>
        </div>
      `).join("");
    });
  </script>
</body>
</html>
