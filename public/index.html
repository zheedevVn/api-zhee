      --text: #111827;
      --muted: #6b7280;
      --pink: #e11d48;
      --radius: 16px;
      --code-bg: #0f172a;
      --code-fg: #e5e7eb;
      --nav-active: #111827;
      --nav-active-fg: #fff;
      --shadow: 0 1px 2px rgba(16,24,40,.05);
    }
    html[data-theme="dark"] {
      --bg: #0b0f17;
      --sidebar: #111827;
      --card: #151c28;
      --line: #243044;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --pink: #fb7185;
      --code-bg: #020617;
      --code-fg: #e5e7eb;
      --nav-active: #f8fafc;
      --nav-active-fg: #111827;
      --shadow: none;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      min-height: 100vh;
    }
    html { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--muted) 35%, transparent) transparent; }
    * { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--muted) 35%, transparent) transparent; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: color-mix(in srgb, var(--muted) 35%, transparent);
      border-radius: 99px;
    }
    ::-webkit-scrollbar-thumb:hover { background: color-mix(in srgb, var(--muted) 55%, transparent); }

    .ico, [data-lucide], .nav svg, .drop a svg, .drop > summary svg, .home-tile svg, article h2 svg {
      width: 18px; height: 18px; flex-shrink: 0; display: block;
    }
    .ico, [data-lucide], svg.lucide {
      stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round;
    }
    .ico-brand { width: 18px; height: 18px; display: block; flex-shrink: 0; fill: currentColor; }
    .ico-btn { width: 18px; height: 18px; }
    .ico-head { width: 20px; height: 20px; }
    .ico-card { width: 18px; height: 18px; }
    .ico-sm { width: 16px; height: 16px; }
    .drop > summary .ico, .drop > summary [data-lucide] { width: 18px; height: 18px; }
    .drop a .ico, .drop a [data-lucide] { width: 18px; height: 18px; }
    .act .ico, .act [data-lucide], .act .ico-brand { width: 16px; height: 16px; }
    article h2 .ico, article h2 [data-lucide], .home-tile .ico, .home-tile [data-lucide] { width: 20px; height: 20px; }
    .crumb .ico, .crumb [data-lucide], .uptime .ico, .uptime [data-lucide] { width: 16px; height: 16px; }
    .icon-btn [data-lucide] { width: 18px; height: 18px; }

    .sidebar {
      width: 280px; background: var(--sidebar); border-right: 1px solid var(--line);
      display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow: hidden;
      flex-shrink: 0;
      transition: width .32s cubic-bezier(.22, 1, .36, 1);
    }
    .nav-toggle { display: none; }
    .icon-btn.nav-close { display: none; margin-left: auto; }
    .backdrop {
      position: fixed; inset: 0; background: rgba(15, 23, 42, .45); z-index: 45;
      opacity: 0; visibility: hidden; pointer-events: none;
      transition: opacity .32s ease, visibility .32s ease;
    }
    .backdrop.show { opacity: 1; visibility: visible; pointer-events: auto; }
    .brand {
      padding: 18px 16px 12px; display: flex; align-items: center; gap: 10px;
      border-bottom: 1px solid var(--line); overflow: hidden; flex-shrink: 0;
      transition: gap .32s cubic-bezier(.22, 1, .36, 1);
    }
    .brand-copy {
      min-width: 0; overflow: hidden; white-space: nowrap; flex: 1;
      opacity: 1; max-width: 180px;
      transition: opacity .2s ease, max-width .32s cubic-bezier(.22, 1, .36, 1);
    }
    .brand-mark {
      width: 38px; height: 38px; border-radius: 12px; flex-shrink: 0;
      background: linear-gradient(135deg, #111827, #b45309);
      color: #fff; font-weight: 800; display: grid; place-items: center; font-size: 14px;
    }
    .brand h1 { font-size: 15px; font-weight: 800; line-height: 1.15; }
    .brand p { font-size: 11px; color: var(--muted); }
    .side-tools {
      padding: 10px 12px; display: flex; gap: 8px; overflow: hidden; flex-shrink: 0;
      transition: padding .32s cubic-bezier(.22, 1, .36, 1), gap .32s cubic-bezier(.22, 1, .36, 1);
    }
    .side-tools input {
      flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px;
      font: inherit; font-size: 13px; outline: none; background: var(--bg); color: var(--text);
      opacity: 1; transition: opacity .2s ease, flex-grow .32s ease, padding .32s ease, border-width .32s ease;
    }
    .icon-btn {
      width: 36px; height: 36px; border: 1px solid var(--line); background: var(--card); color: var(--text);
      border-radius: 10px; cursor: pointer; display: grid; place-items: center; flex-shrink: 0;
    }
    .nav { overflow-y: auto; overflow-x: hidden; flex: 1; padding: 4px 10px 24px; }
    .drop { margin: 4px 0; }
    .drop > summary {
      list-style: none; cursor: pointer; display: flex; align-items: center;
      padding: 8px 10px; border-radius: 10px; font-size: 12px; font-weight: 800;
      letter-spacing: .06em; text-transform: uppercase; color: var(--muted); user-select: none;
      gap: 10px; white-space: nowrap; overflow: hidden;
    }
    .drop > summary::-webkit-details-marker,
    .drop > summary::marker { display: none; content: none; }
    .drop > summary:hover { background: color-mix(in srgb, var(--text) 6%, transparent); }
    .nav-label {
      min-width: 0; overflow: hidden; white-space: nowrap;
      opacity: 1; transition: opacity .18s ease;
    }
    .chevron {
      margin-left: auto; width: 16px !important; height: 16px !important; flex-shrink: 0;
      transition: transform .22s ease, opacity .18s ease, width .32s ease;
    }
    .drop.is-open .chevron { transform: rotate(180deg); }
    svg.lucide { overflow: visible; flex-shrink: 0; display: block; }
    .drop-panel { overflow: hidden; height: 0; transition: height .28s cubic-bezier(.22, 1, .36, 1); }
    .drop.is-open .drop-panel { height: auto; }
    .drop a {
      display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text);
      font-size: 13.5px; font-weight: 600; padding: 7px 10px 7px 14px; border-radius: 10px; margin: 1px 0;
      white-space: nowrap; overflow: hidden;
    }
    .drop a:hover { background: color-mix(in srgb, var(--text) 6%, transparent); }
    .drop a.active { background: var(--nav-active); color: var(--nav-active-fg); }

    .main { flex: 1; min-width: 0; overflow-y: auto; overflow-x: hidden; }
    .topbar {
      padding: 16px 28px 8px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    .crumb { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
    .uptime {
      font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 8px;
      background: var(--card); border: 1px solid var(--line); padding: 6px 10px; border-radius: 999px;
    }
    .uptime strong { color: var(--text); font-weight: 700; }
    article { padding: 8px 28px 48px; max-width: 1080px; }
    article h2 { font-size: 26px; font-weight: 800; margin-bottom: 6px; display: flex; align-items: center; gap: 10px; }
    .lead { color: var(--muted); font-size: 14.5px; line-height: 1.6; margin-bottom: 22px; }
    .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 20px 22px; box-shadow: var(--shadow);
    }
    .card h3 { font-size: 16px; margin-bottom: 12px; }
    .label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; }
    .endpoint { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 13px; color: var(--pink); word-break: break-all; line-height: 1.55; }
    .muted { color: var(--muted); font-size: 13px; margin-top: 8px; }
    .row-btns { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
    button.act, a.act {
      font: inherit; font-size: 13px; font-weight: 700; border-radius: 10px; padding: 8px 12px; cursor: pointer;
      border: 1px solid var(--line); background: var(--card); color: var(--text); text-decoration: none;
      display: inline-flex; align-items: center; gap: 8px;
    }
    button.act:hover, a.act:hover { filter: brightness(1.05); }
    .act-dark { background: var(--nav-active); color: var(--nav-active-fg); border-color: var(--nav-active); }
    .sample { background: var(--code-bg); color: var(--code-fg); border-radius: var(--radius); padding: 18px 20px; overflow: auto; }
    .sample-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-weight: 700; font-family: "Plus Jakarta Sans", sans-serif; }
    .sample pre { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12.5px; line-height: 1.55; white-space: pre-wrap; }
    .try-card { margin-bottom: 16px; }
    .try-row { display: grid; grid-template-columns: minmax(140px, 180px) 1fr; gap: 8px; margin-bottom: 8px; }
    .try-row input, .try-row select {
      width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px;
      font: inherit; font-size: 13px; outline: none; background: var(--bg); color: var(--text);
    }
    .try-row input:focus, .try-row select:focus { border-color: color-mix(in srgb, var(--pink) 45%, var(--line)); }
    .try-media { margin-bottom: 16px; }
    .try-media audio, .try-media video { width: 100%; max-width: 560px; }
    .try-media img { max-width: 100%; max-height: 360px; border-radius: 12px; border: 1px solid var(--line); }
    @media (max-width: 900px) {
      .try-row { grid-template-columns: 1fr; }
    }
    .home-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
    .home-tile {
      background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px;
      text-decoration: none; color: inherit; display: flex; flex-direction: column; gap: 8px; align-items: stretch;
    }
    .home-tile-top { display: flex; align-items: center; gap: 10px; }
    .home-tile-top strong { display: block; margin: 0; line-height: 1.35; }
    .home-tile span { font-size: 12.5px; color: var(--muted); line-height: 1.45; padding-left: 30px; }

    .toast, .dialog-backdrop { z-index: 40; }
    .toast {
      position: fixed; right: 18px; bottom: 18px; background: var(--nav-active); color: var(--nav-active-fg);
      padding: 11px 14px; border-radius: 10px; font-size: 13px; font-weight: 600;
      opacity: 0; transform: translateY(8px); pointer-events: none; transition: .2s;
    }
    .toast.show { opacity: 1; transform: none; }
    .dialog-backdrop {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45);
      align-items: center; justify-content: center; padding: 20px;
    }
    .dialog-backdrop.show { display: flex; }
    .dialog-box {
      background: var(--card); color: var(--text); border: 1px solid var(--line);
      border-radius: 16px; padding: 22px; max-width: 400px; width: 100%;
    }
    .dialog-box p { margin: 0 0 16px; line-height: 1.5; }

    @media (min-width: 901px) {
      .nav-toggle { display: grid; }
      body.nav-collapsed .sidebar { width: 72px; overflow: hidden; }
      body.nav-collapsed .brand {
        justify-content: center; padding: 16px 17px 10px; gap: 0;
      }
      body.nav-collapsed .brand-copy,
      body.nav-collapsed .icon-btn.nav-close,
      body.nav-collapsed .side-tools input,
      body.nav-collapsed .nav-label,
      body.nav-collapsed .chevron { display: none !important; }
      body.nav-collapsed .side-tools { justify-content: center; padding: 8px 18px 6px; gap: 0; }
      body.nav-collapsed .nav { padding: 6px 16px 20px; overflow-x: hidden; }
      body.nav-collapsed .drop { width: 40px; margin: 2px auto; overflow: hidden; }
      body.nav-collapsed .drop > summary {
        display: grid !important; place-items: center;
        width: 40px; height: 40px; min-width: 40px; max-width: 40px;
        margin: 0; padding: 0 !important; gap: 0 !important;
        border-radius: 12px; overflow: hidden;
      }
      body.nav-collapsed .drop > summary > :not(:first-child) { display: none !important; }
      body.nav-collapsed .drop-panel { display: none !important; }
      body.nav-collapsed .drop.has-active > summary {
        background: var(--nav-active); color: var(--nav-active-fg);
      }
      body.nav-collapsed .drop > summary:hover {
        background: color-mix(in srgb, var(--text) 10%, transparent);
      }
      body.nav-collapsed .drop.has-active > summary:hover {
        background: var(--nav-active);
      }
    }
    @media (max-width: 900px) {
      .nav-toggle, .icon-btn.nav-close { display: grid; }
      .sidebar {
        position: fixed; left: 0; top: 0; bottom: 0;
        width: min(86vw, 300px); height: 100dvh; z-index: 50;
        transform: translateX(-105%);
        transition: transform .32s cubic-bezier(.22, 1, .36, 1);
        border-right: 1px solid var(--line);
      }
      .sidebar.open { transform: translateX(0); box-shadow: 12px 0 40px rgba(0,0,0,.25); }
      .topbar {
        padding: 12px 14px 10px; position: sticky; top: 0; z-index: 20;
        background: var(--bg); flex-wrap: nowrap; gap: 8px;
      }
      .crumb { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      article { padding: 8px 14px 36px; padding-bottom: max(36px, env(safe-area-inset-bottom)); }
      article h2 { font-size: 22px; }
      .cards { grid-template-columns: 1fr; }
      .home-grid { grid-template-columns: 1fr; }
      .home-tile span { padding-left: 0; }
      .sample { padding: 14px; }
      .sample-head { flex-wrap: wrap; gap: 8px; }
      .row-btns .act { flex: 1; justify-content: center; }
      .uptime { display: none; }
      .toast { left: 12px; right: 12px; bottom: max(12px, env(safe-area-inset-bottom)); }
      .lead { font-size: 14px; }
    }

    function loadLive(url, timeoutMs) {
      if (liveAbort) liveAbort.abort();

      const media = document.getElementById("tryMedia");
      if (!pre) return;
      const ac = new AbortController();
      liveAbort = ac;
      if (status) status.textContent = "Đang chạy…";
      pre.textContent = "GET " + url;
      if (media) media.innerHTML = "";
      const timer = setTimeout(() => ac.abort(), timeoutMs || 12000);
      fetch(url, { signal: ac.signal, cache: "no-store", headers: { Accept: "application/json, audio/*, image/*, */*" } })
        .then(async (r) => {
          const type = String(r.headers.get("content-type") || "");

        .then((out) => {

            return;
          }
          if (type.includes("image")) {

            const src = URL.createObjectURL(blob);
            if (media) media.innerHTML = `<img src="${src}" alt="Kết quả API">`;
            pre.textContent = "HTTP " + out.status + " · " + (out.type || "image") + " · " + out.buf.byteLength + " bytes";
            if (status) status.textContent = "Ảnh";
            if (copyBtn) copyBtn.setAttribute("data-copy", url);

          const text = new TextDecoder("utf-8").decode(out.buf);
          let parsed = null;
          let body = text;
          try { parsed = JSON.parse(text); body = JSON.stringify(parsed, null, 2); } catch (_) {}
          if (parsed && currentTool && Array.isArray(parsed.cu_phap)) {
            const extra = keysFromTextList([].concat(parsed.cu_phap, parsed.vi_du || []));
            currentTool._tryKeys = paramKeysFor(currentTool, extra);
            panel.querySelectorAll("[data-try-key]").forEach((sel) => {
              const cur = sel.value;
              const keys = currentTool._tryKeys;
              sel.innerHTML = "";
              keys.forEach((k) => {
                const opt = document.createElement("option");
                opt.value = k;
                opt.textContent = keyLabel(k);
                if (k === cur) opt.selected = true;
                sel.appendChild(opt);
              });
              if (cur && ![...sel.options].some((o) => o.value === cur)) {
                const opt = document.createElement("option");
                opt.value = cur;
                opt.textContent = keyLabel(cur);
                opt.selected = true;
                sel.appendChild(opt);
              }
            });
          }
          pre.textContent = body;
          if (parsed && parsed.trang_thai === "huong_dan") {
            if (status) status.textContent = "Hướng dẫn — chọn đúng tham số hoặc dán link dùng được";
          } else if (status) status.textContent = "HTTP " + out.status;
          if (copyBtn) copyBtn.setAttribute("data-copy", body);
        })
        .catch((e) => {
          if (liveAbort !== ac) return;
          if (e.name === "AbortError") pre.textContent = "Hết thời gian chờ. Thử lại hoặc mở tab mới.";
          else pre.textContent = "Không chạy được: " + (e.message || e);
          if (status) status.textContent = "Lỗi";
        })
        .finally(() => clearTimeout(timer));
    }

    function renderTool(id) {
      const t = CATALOG.find((x) => x.id === id);
      if (!t) return renderHome();
      currentTool = t;
      const full = t.vi_du || (ORIGIN + t.path);
      panel.innerHTML = `
        <h2>${ico(iconFor(t.path, t.chuyen_muc), "ico-head")} ${esc(t.ten)}</h2>
        <p class="lead">${esc(t.mo_ta)}</p>
        <div class="cards">
          <div class="card">
            <h3>Endpoint</h3>
            <div class="label">GET</div>
            <div class="endpoint">${esc(full)}</div>
            <p class="muted">Path: ${esc(t.path)}</p>
            <div class="row-btns">
              <a class="act" href="${esc(t.path + (t.params || ""))}" target="_blank" rel="nofollow">${ico("external-link")} Mở tab mới</a>
              <button class="act" type="button" data-copy="${esc(full)}">${ico("copy")} Sao chép</button>
            </div>
          </div>
          <div class="card">
            <h3>Đường dẫn</h3>
            <div class="label">Path</div>
            <div class="endpoint">${esc(t.path)}</div>
            <p class="muted">${esc(t.chuyen_muc)}</p>
          </div>
        </div>
        <div class="card try-card">
          <h3>Chạy trên giao diện</h3>
          <p class="muted" style="margin-top:0">Chọn tham số có sẵn, dán link hoặc giá trị. Link dùng được thì ra dữ liệu; không dùng được thì API trả hướng dẫn.</p>
          <div id="tryFields"></div>
          <p class="endpoint" id="tryUrl"></p>
          <div class="row-btns">
            <button class="act act-dark" type="button" id="tryRun">${ico("play")} Chạy API</button>
            <a class="act" id="tryOpen" target="_blank" rel="nofollow">${ico("external-link")} Mở URL</a>
          </div>
        </div>
        <div id="tryMedia" class="try-media"></div>
        <div class="sample">
          <div class="sample-head">
            <span id="liveStatus">Đang chạy…</span>
            <button class="act" type="button" id="liveCopy" data-copy="">${ico("copy")} Sao chép JSON</button>
          </div>
          <pre id="liveJson">Đang gọi API…</pre>
        </div>`;
      fillTryFields(t);
      updateTryUrl();
      const auto = autoloadUrl(t);
      loadLive(auto, 10000);
    }

    function revealActiveGroup() {
      const active = navEl.querySelector("a.active");
      const details = active && active.closest(".drop");
      if (!details || details.classList.contains("is-open")) return;
      if (document.body.classList.contains("nav-collapsed") && !isMobile()) {
        details.classList.add("is-open");
        rememberOpen();
        return;
      }
      details.classList.add("is-open");
      const panelEl = details.querySelector(".drop-panel");
      const inner = panelEl && panelEl.querySelector(".drop-panel-inner");
      if (panelEl) panelEl.style.height = (inner ? inner.scrollHeight : 0) + "px";
      rememberOpen();
    }
    function paint() {
      const id = currentId();
      document.querySelectorAll(".nav a").forEach((a) => a.classList.toggle("active", a.dataset.id === id));
      document.querySelectorAll(".nav .drop").forEach((d) => {
        d.classList.toggle("has-active", !!d.querySelector(`a.active`));
      });
      revealActiveGroup();
      const t = CATALOG.find((x) => x.id === id);
      crumb.innerHTML = ico("search") + " " + (id === "home" ? "Public API" : (t ? t.ten : "Public API"));
      document.title = id === "home" ? "Zhee API — Tài liệu công khai | Hồ Đức Minh" : ((t ? t.ten : "API") + " | Zhee API");
      if (id === "home") {
        if (liveAbort) liveAbort.abort();
        liveAbort = null;
        currentTool = null;
        renderHome();
      } else renderTool(id);
      paintIcons();
    }

    document.getElementById("q").addEventListener("input", (e) => {
      renderNav(e.target.value);
      document.querySelectorAll(".nav a").forEach((a) => a.classList.toggle("active", a.dataset.id === currentId()));
      document.querySelectorAll(".nav .drop").forEach((d) => d.classList.toggle("has-active", !!d.querySelector("a.active")));
      paintIcons();
    });
    document.body.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-copy]");
      if (btn) copyText(btn.getAttribute("data-copy"));
    });
    panel.addEventListener("input", (e) => {
      if (e.target.closest(".try-card")) updateTryUrl();
    });
    panel.addEventListener("click", (e) => {
      if (e.target.closest("#tryAdd")) {
        const box = document.getElementById("tryFields");
        if (!box || !currentTool) return;
        const keys = currentTool._tryKeys || paramKeysFor(currentTool);
        const used = [...box.querySelectorAll("[data-try-key]")].map((s) => s.value);
        const next = keys.find((k) => !used.includes(k)) || keys[0] || "";
        box.appendChild(makeTryRow(next, "", keys));
        updateTryUrl();
        return;
      }
      if (e.target.closest("#tryRun")) {
        e.preventDefault();
        const url = updateTryUrl();
        if (url) loadLive(url, 15000);
      }
    });
    function applyCatalog(data) {
      const ds = (data && data.danh_sach) || {};
      CATALOG = Object.values(ds)
        .filter((x) => x && x.duong_dan && !/\/video$/i.test(x.duong_dan))
        .map((x) => ({
          id: slug(x.duong_dan),
          ten: x.ten_api,
          mo_ta: x.mo_ta,
          path: x.duong_dan,
          chuyen_muc: x.chuyen_muc,
          vi_du: x.link_vi_du,
          params: (x.link_vi_du || "").split(x.duong_dan)[1] || ""
        }));

      // Keep the newly-added Mega tool visible even if an old cached /list
      // response is returned by a browser, proxy, or stale deployment.
      if (!CATALOG.some((x) => x.path === "/api/mxh/mega")) {
        CATALOG.push({
          id: slug("/api/mxh/mega"),
          ten: "MEGA Public File & Folder Inspector",
          mo_ta: "Kiểm tra metadata file/folder MEGA public; không tra cứu user riêng tư.",
          path: "/api/mxh/mega",
          chuyen_muc: "Cloud Storage",
          vi_du: `${location.origin}/api/mxh/mega?url={link_mega_public}`,
          params: "?url={link_mega_public}"
        });
      }

      // Keep Lazada visible in the menu while an older /list response is cached
      // or before the gateway deployment has propagated to every edge.
      if (!CATALOG.some((x) => x.path === "/api/mxh/lazada")) {
        CATALOG.push({
          id: slug("/api/mxh/lazada"),
          ten: "Lazada Shop & Product Lookup",
          mo_ta: "Tra cứu shop, seller ID hoặc sản phẩm Lazada từ dữ liệu public; không cần cookie/session.",
          path: "/api/mxh/lazada",
          chuyen_muc: "Mạng Xã Hội",
          vi_du: `${location.origin}/api/mxh/lazada?url={link_lazada_public}`,
          params: "?url={link_lazada_public}"
        });
      }
    }
    function loadUI() {
      const qEl = document.getElementById("q");
      if (!CATALOG.length) {
        navEl.innerHTML = `<p class="muted" style="padding:12px 10px">Đang tải giao diện…</p>`;
        panel.innerHTML = `<h2>${ico("loader", "ico-head")} Đang tải</h2><p class="lead">Đang lấy danh sách API.</p>`;
        paintIcons();
      }
      return fetch("/list?t=" + Date.now(), { cache: "no-store" })
        .then((r) => r.json())
        .then((data) => {
          applyCatalog(data);
          renderNav(qEl ? qEl.value : "");
          paint();
        })
        .catch(() => {
          if (!CATALOG.length) {
            panel.innerHTML = `<h2>Không tải được giao diện</h2><p class="lead">Tải lại trang để thử lại.</p>`;
            navEl.innerHTML = "";
            paintIcons();
            return;
          }
          renderNav(qEl ? qEl.value : "");
          paint();
        });
    }

    window.addEventListener("hashchange", () => {
      if (isMobile()) closeNav();
      if (CATALOG.length) paint();
      loadUI();
    });
    navEl.addEventListener("click", (e) => {
      if (e.target.closest("a") && isMobile()) closeNav();
    });

    const u = tinhUptime();
    document.getElementById("uptime").innerHTML = ico("clock-3") + " Từ " + u.moc + " · <strong>" + u.chuoi + "</strong>";
    paintIcons();
    loadUI();
  </script>
</body>
</html>
