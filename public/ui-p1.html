  <style>
    :root {
      --bg: #f4f5f8;
      --sidebar: #ffffff;
      --card: #ffffff;
      --line: #eceef3;
      --text: #111827;
      --muted: #6b7280;
      --pink: #e11d48;
      --link: #be123c;
      --radius: 16px;
      --code-bg: #0f172a;
      --code-fg: #e5e7eb;
      --nav-active: #111827;

      --shadow: 0 1px 2px rgba(16,24,40,.05);
    }
    html[data-theme="dark"] {
      --bg: #0b0f17;
      --sidebar: #111827;
      --card: #151c28;
      --line: #243044;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --pink: #fb7185;
      --link: #fda4af;
      --code-bg: #020617;
      --code-fg: #e5e7eb;
      --nav-active: #f8fafc;

    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body {

      color: var(--text);

    html { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--muted) 35%, transparent) transparent; }

    .ico, [data-lucide], .nav svg, .drop a svg, .drop > summary svg, .home-tile svg, article > h1 svg, article h2 svg {

    .crumb .ico, .crumb [data-lucide], .uptime .ico, .uptime [data-lucide] { width: 16px; height: 16px; }

    .sidebar {
      width: 310px; background: var(--sidebar); border-right: 1px solid var(--line);
      display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow: hidden;

    .icon-btn.nav-close { display: none; margin-left: auto; }
    .backdrop {

      transition: opacity .32s ease, visibility .32s ease;
    }
    .backdrop.show { opacity: 1; visibility: visible; pointer-events: auto; }
    .brand {
      padding: 18px 16px 12px; display: flex; align-items: center; gap: 10px;
      border-bottom: 1px solid var(--line); overflow: hidden; flex-shrink: 0;
      transition: gap .32s cubic-bezier(.22, 1, .36, 1);

    .brand-copy {

    }
    .icon-btn {
      width: 36px; height: 36px; border: 1px solid var(--line); background: var(--card); color: var(--text);
      border-radius: 10px; cursor: pointer; display: grid; place-items: center; flex-shrink: 0;

    .nav { overflow-y: auto; overflow-x: hidden; flex: 1; padding: 4px 10px 24px; }
    .drop { margin: 4px 0; }

      list-style: none; cursor: pointer; display: flex; align-items: center;
      padding: 8px 10px; border-radius: 10px; font-size: 12px; font-weight: 800;
      letter-spacing: .06em; text-transform: uppercase; color: var(--muted); user-select: none;
      gap: 10px; white-space: nowrap; overflow: hidden;

    svg.lucide { overflow: visible; flex-shrink: 0; display: block; }
    svg.zhee-glyph { transform-origin: center; transform-box: fill-box; }
    a:hover svg.zhee-glyph,
    button:hover svg.zhee-glyph,
    summary:hover svg.zhee-glyph,
    h2:hover svg.zhee-glyph,
    .uptime:hover svg.zhee-glyph,
    .crumb:hover svg.zhee-glyph,
    .icon-btn:hover svg.zhee-glyph,
    .tool-icon:hover svg.zhee-glyph,
    .home-tile:hover svg.zhee-glyph {
      animation: var(--zhee-self) .62s cubic-bezier(.22, 1, .36, 1);
    }
    img.ico-brand-img[data-fx] { transform-origin: center; }
    a:hover img.ico-brand-img[data-fx],
    button:hover img.ico-brand-img[data-fx],
    summary:hover img.ico-brand-img[data-fx],
    h2:hover img.ico-brand-img[data-fx],
    .tool-icon:hover img.ico-brand-img[data-fx],
    .home-tile:hover img.ico-brand-img[data-fx],
    .social-link:hover img.ico-brand-img[data-fx],
    .contact-card:hover img.ico-brand-img[data-fx] {
      animation: var(--zhee-fx) .78s cubic-bezier(.22, 1, .36, 1);
    }
    @media (prefers-reduced-motion: reduce) {
      svg.zhee-glyph, img.ico-brand-img[data-fx] { animation: none !important; }
    }
    .drop-panel { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .28s cubic-bezier(.22, 1, .36, 1); }
    .drop-panel-inner { min-height: 0; overflow: hidden; }
    .drop.is-open .drop-panel { grid-template-rows: 1fr; }
    .drop a {
      display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text);

      white-space: nowrap; overflow: hidden; min-width: 0;

    .main { flex: 1; min-width: 0; overflow-y: auto; overflow-x: hidden; }

    .jump-row a:hover { border-color: color-mix(in srgb, #60a5fa 50%, var(--line)); }
    .seo-links { list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 8px 0 0; }
    .seo-links a { display: grid; gap: 2px; min-width: 0; padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); color: inherit; text-decoration: none; }
    .seo-links strong { font-size: 14px; }

      border-radius: 999px; background: color-mix(in srgb, #2aabee 8%, var(--card));

    .account-bar { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
    .auth-open { border-radius: 999px; padding: 7px 12px; white-space: nowrap; }

    /* Interaction polish: make every clickable surface feel responsive and visible. */
    html, body { cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='22' height='22' viewBox='0 0 22 22'><path d='M4 2 L4 17 L8.2 13.2 L11.4 19.2 L13.6 18.1 L10.3 12.2 L16 12.2 Z' fill='%23111827' stroke='white' stroke-width='1.2' stroke-linejoin='round'/></svg>") 3 2, auto; }

    }
    .icon-btn, button.act, a.act {
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease, background .18s ease;
    }
    .icon-btn:hover, button.act:hover, a.act:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(15, 23, 42, .14); }
    .icon-btn:active, button.act:active, a.act:active { transform: translateY(0) scale(.97); }
    .drop a { cursor: pointer; }
    .drop a .nav-label { transition: color .18s ease, transform .18s ease; }
    .drop a:hover .nav-label { transform: translateX(2px); }
    .home-tile { cursor: pointer; }
    .home-tile::before {
      content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0;
      background: linear-gradient(115deg, transparent 22%, rgba(255,255,255,.12) 45%, transparent 68%);
      transform: translateX(-100%); transition: opacity .2s ease, transform .6s ease;
    }
    .home-tile:hover::before { opacity: 1; transform: translateX(100%); }
    .social-link { cursor: pointer; }
    ::selection { background: color-mix(in srgb, #60a5fa 35%, transparent); color: var(--text); }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    }
    @media (max-width: 640px) { .home-hero { padding: 22px 18px 16px; } .support-card { align-items: flex-start; flex-direction: column; } .support-card .act { width: 100%; justify-content: center; } }

    .theme-switch { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; flex-shrink: 0; color: var(--text); font-size: 12px; font-weight: 800; }
    .theme-switch input {
      appearance: none; width: 42px; height: 24px; margin: 0; flex: 0 0 42px; border-radius: 999px;
      border: 1px solid var(--line); background: color-mix(in srgb, var(--text) 12%, var(--card));
      position: relative; cursor: pointer;
    }
    .theme-switch input::after {
      content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%;
      background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .18s ease;
    }
    .theme-switch input:checked { background: #2563eb; border-color: #2563eb; }
    .theme-switch input:checked::after { transform: translateX(18px); }
    .hamburger { width: 18px; height: 18px; display: block; }
    dialog.modal {
      position: fixed; inset: auto; top: 50%;
      left: calc(var(--side) + (100% - var(--side)) / 2);
      translate: -50% -50%;
      width: min(440px, calc(100vw - var(--side) - 24px)); height: fit-content;
      max-height: calc(100dvh - 24px); margin: 0; padding: 0; border: 0; background: transparent;
      color: var(--text); overflow: auto;
    }
    dialog.modal[open] .modal-card { animation: dialogIn .2s ease; }
    dialog.modal.is-closing .modal-card { opacity: 0; transform: translateY(8px); transition: opacity .18s ease, transform .18s ease; }
    dialog.modal::backdrop { background: rgba(2, 6, 23, .62); backdrop-filter: blur(8px); animation: scrimIn .2s ease; }
    @keyframes dialogIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    dialog.modal.is-closing::backdrop { animation: scrimOut .18s ease forwards; }
    dialog.modal .modal-card {
      background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 18px;
      box-shadow: 0 24px 70px rgba(0,0,0,.38); padding: 22px 20px 18px;
    }
    @keyframes scrimIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes scrimOut { from { opacity: 1; } to { opacity: 0; } }
    .auth-card { position: relative; }
    .auth-card h3 { margin: 0 36px 14px 0; font-size: 22px; letter-spacing: -.03em; }
    .segment { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0 0 14px; }
    .segment-item {
      display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px;
      border: 1px solid var(--line); border-radius: 12px; background: transparent; font-size: 13px; font-weight: 800;
    }
    .segment-item input { width: 16px; height: 16px; margin: 0; accent-color: #2563eb; }
    .segment-item:has(input:checked) { background: var(--nav-active); color: var(--nav-active-fg); border-color: var(--nav-active); }
    .login-form { display: grid; gap: 12px; }
    .login-form label { display: grid; gap: 6px; font-size: 12px; font-weight: 800; color: var(--muted); }
    .login-form input {
      width: 100%; height: 46px; border: 1px solid var(--line); border-radius: 12px; padding: 0 12px;
      background: var(--bg); color: var(--text); font: inherit; font-size: 14px; font-weight: 600;
    }
    .login-form input:focus { border-color: #60a5fa; outline: 3px solid color-mix(in srgb, #60a5fa 35%, transparent); outline-offset: 1px; }
    .login-form button { width: 100%; min-height: 46px; justify-content: center; border-radius: 12px; }
    .auth-or { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; margin: 14px 0 12px; color: var(--muted); font-size: 12px; font-weight: 700; }
    .auth-or::before, .auth-or::after { content: ""; height: 1px; background: var(--line); }
    dialog.is-register .login-form, dialog.is-register .auth-or { display: none; }
    .gate { display: grid; place-items: center; min-height: min(520px, calc(100dvh - 180px)); padding: 8px 0 28px; }
    .gate-card { width: min(440px, 100%); margin: 0 auto; padding: 22px 20px; border: 1px solid var(--line); border-radius: 18px; background: var(--card); box-shadow: var(--shadow); }
    .gate-card h1, .gate-card h2 { margin-top: 0; }
    .gate-card .lead { margin-bottom: 0; }
    .gate-card .act { width: 100%; justify-content: center; margin-top: 16px; min-height: 44px; }
    .scramble-line { display: block; flex: 1 1 12rem; min-width: 0; max-width: 100%; overflow-wrap: anywhere; }
    .scramble { font: inherit; letter-spacing: inherit; white-space: normal; overflow-wrap: anywhere; }
    .skeleton-wrap { position: relative; }
    .sk { border-radius: 12px; background: linear-gradient(90deg, color-mix(in srgb, var(--line) 80%, transparent), color-mix(in srgb, var(--card) 55%, var(--text) 8%), color-mix(in srgb, var(--line) 80%, transparent)); background-size: 200% 100%; animation: sk 1.1s ease infinite; }
    .sk-title { height: 28px; width: min(280px, 72%); margin-bottom: 12px; }
